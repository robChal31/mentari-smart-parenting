name: Deploy Monorepo to VPS

on:
  push:
    branches: ["main"]

# Deploy yang saling menimpa bisa membuat `.next` setengah tertimpa di tengah
# restart. Satu deploy pada satu waktu.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Versi pnpm HARUS 9. Lockfile di repo adalah lockfileVersion 9.0;
      # pnpm 8 menolaknya dengan ERR_PNPM_LOCKFILE_BREAKING_CHANGE.
      # `packageManager` di package.json juga mengunci 9.15.9.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root `pnpm build` sudah mengurutkan sendiri: shared → database → api → web.
      # `--filter web build` saja akan gagal karena API meng-import
      # @mentari/shared dan @mentari/database dari folder dist/.
      - name: Build all packages
        run: pnpm build

      - name: Prepare artifacts
        run: |
          set -euo pipefail

          # Next.js standalone: berisi server.js + node_modules minimal.
          cp -r apps/web/.next/standalone deploy/web
          cp -r apps/web/.next/static deploy/web/apps/web/.next/static
          cp -r apps/web/public deploy/web/apps/web/public

          # Struktur standalone mengikuti layout monorepo, jadi server.js ada di
          # deploy/web/apps/web/server.js — bukan di root.

          # NestJS: hasil tsc (dist/) + package.json saja.
          # node_modules TIDAK ikut: symlink pnpm workspace rusak saat di-SCP dan
          # isinya devDependency. Dependency produksi dipasang di VPS.
          mkdir -p deploy/api
          cp -r apps/api/dist deploy/api/dist
          cp apps/api/package.json deploy/api/package.json

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/apps/"
          strip_components: 1

      # Install dependency produksi di VPS (sekali per deploy, cepat karena di-cache).
      # Kalau kamu lebih suka menyiapkan node_modules manual, hapus step ini.
      - name: Restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/apps

            # Pasang dependency API kalau belum ada (mis. setelah deploy pertama
            # atau lockfile berubah).
            if [ ! -d api/node_modules ]; then
              cd api && pnpm install --prod --ignore-scripts && cd ..
            fi

            # `reload` = zero-downtime dan aman diulang. `start` pada deploy kedua
            # gagal karena prosesnya sudah berjalan.
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save

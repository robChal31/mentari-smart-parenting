name: Deploy Monorepo to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js & NestJS
        run: |
          pnpm --filter web build
          pnpm --filter api build

      - name: Prepare artifacts
        run: |
          # Siapkan Next.js standalone
          mkdir -p deploy/web
          cp -r apps/web/.next/standalone/. deploy/web/
          cp -r apps/web/.next/static deploy/web/.next/static
          cp -r apps/web/public deploy/web/public
          
          # Siapkan NestJS (beserta node_modules production)
          mkdir -p deploy/api
          cp -r apps/api/dist deploy/api/
          cp apps/api/package.json deploy/api/
          # Copy node_modules hanya untuk API (karena Next.js standalone sudah include)
          cp -r node_modules deploy/api/node_modules

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/apps/"
          strip_components: 1

      - name: Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/apps
            pm2 start ecosystem.config.js
            pm2 save